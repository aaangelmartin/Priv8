     Vista: ?v=hero | flujo | clases | verticales | pie | cabecera&t=Título&s=Segunda línea -->

<style>

}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; -webkit-font-smoothing: antialiased; }
body { font: 400 16px/1.5 var(--f-body); color: var(--ink); }
#v { position: relative; width: 1280px; overflow: hidden; }
.band { background: var(--band); color: #fff; }
.field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.clear::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 42% 48% at 50% 50%, var(--band) 46%, transparent 80%); }
.over { position: relative; z-index: 1; }
h1, h2 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: -.05em; line-height: 1; }
.soft { color: var(--soft); }
.eight { display: block; }
.mono { font-family: var(--f-mono); }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 22px; position: relative; }

<script>
const LOGO = { reposo: '__REPOSO__', nove: '__NOVE__', nuncasale: '__NUNCASALE__' };

const eye = (k, fill, w) => `<svg class="eight" viewBox="60 60 184.4 130.8" style="width:${w}px" aria-hidden="true"><path fill="${fill}" d="${LOGO[k]}"/></svg>`;
const ic = {
  mail: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>',

  sign: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  voice: '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  banks: '<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5M5 10v7M10 10v7M14 10v7M19 10v7M3 20h18"/></svg>',
  speaker: '<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  arrow: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};

/* El campo de datos de la portada (Field.jsx), quieto: filas de datos inventados en Plex Mono, tenues en el centro
   y más visibles a los lados. Dentro de la lente cada dato se ve como su token, en blanco. */
const DATA = [
  ['ES43 9100 0001 5740 1234 5678', '‹IBAN_1›'], ['3.412,58 €', '‹IMPORTE_1›'], ['Ángel Martín', '‹NOMBRE_1›'],
  ['12345678Z', '‹DNI_1›'], ['1.180,00 €', '‹IMPORTE_2›'], ['Álvaro Carpintero', '‹NOMBRE_2›'], ['B12345674', '‹CIF_1›'],
  ['+34 600 000 000', '‹TELEFONO_1›'], ['ES71 9400 0007 0206 0223 3441', '‹IBAN_2›'], ['Pablo Rojo', '‹NOMBRE_3›'], ['200,00 €', '‹IMPORTE_3›'],
  ['Suministros Lumen', '‹NOMBRE_4›'], ['12.050,00 €', '‹IMPORTE_4›'], ['Marco Barroso', '‹NOMBRE_5›'],
  ['4111 1111 1111 1111', 'nunca sale'], ['X1234567L', '‹NIE_1›'], ['ES08 9300 0001 0522 0033 4455', '‹IBAN_3›'],
  ['+34 611 000 000', '‹TELEFONO_2›'], ['48215963M', '‹DNI_2›'], ['980,40 €', '‹IMPORTE_5›'], ['PIN 4821', 'nunca sale'],
  ['53120874M', '‹DNI_3›'], ['71409352X', '‹DNI_4›'], ['Y2918374R', '‹NIE_2›'], ['29384756W', '‹DNI_5›'],
];
const sstep = (v) => { const x = Math.min(1, Math.max(0, v)); return x * x * (3 - 2 * x); };
function field(host, { lens = null, start = 0, flat = 0 } = {}) {
  const cv = document.createElement('canvas'); cv.className = 'field'; host.prepend(cv);
  const W = host.offsetWidth, H = host.offsetHeight, dpr = 2, ROW = 34;
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.font = '500 13px "IBM Plex Mono"'; ctx.textBaseline = 'middle';
  let k = start;
  for (let y = 12; y < H + ROW; y += ROW) {
    let x = -((y / ROW) * 53 + start * 17) % 180;
    while (x < W) {
      const [real, tok] = DATA[k++ % DATA.length];
      const w = ctx.measureText(real).width, cx = x + w / 2;
      const off = Math.abs(cx - W / 2) / (W / 2);
      const base = Math.min(1, Math.max(0.1, (off - 0.22) * 2.4));
      const fade = flat ? flat : base;
      const t = lens ? sstep((lens.r * 1.08 - Math.hypot((cx - lens.x) / (lens.sx || 1), y - lens.y)) / (lens.r * 0.3)) : 0;
      if (t < 0.5) { ctx.fillStyle = `rgba(215,223,255,${0.32 * fade})`; ctx.textAlign = 'left'; ctx.fillText(real, x, y); }
      else { ctx.fillStyle = `rgba(255,255,255,${(0.32 + 0.63 * t) * fade})`; ctx.textAlign = 'center'; ctx.fillText(tok, cx, y); }
      x += w + 36;
    }
  }
}

/* La transición en píxeles de la web (Blend en Field.jsx): rejilla de 72 x 6, cada fila más llena que la anterior,
   con las esquinas de fuera redondeadas y los rincones de dentro curvados. Devuelve los caminos de las celdas «llenas». */
function pixels(w, seed) {
  const cols = 72, rows = 6, H = Math.round(Math.max(30, Math.min(56, w * 0.04))), paths = [];
  const cw = w / cols, ch = H / rows, r = Math.min(cw, ch) * 0.5;
  let sd = seed * 9301 + 49297; const rnd = () => { sd = (sd * 9301 + 49297) % 233280; return sd / 233280; };
  const g = []; for (let y = 0; y < rows; y++) { g.push([]); for (let x = 0; x < cols; x++) g[y].push(rnd() < (y + 0.5) / rows); }
  const on = (x, y) => (y >= rows ? true : y < 0 ? false : g[y][Math.max(0, Math.min(cols - 1, x))]);
  const f = (n) => n.toFixed(2);
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const X = x * cw, Y = y * ch, X2 = X + cw, Y2 = Y + ch;
    if (on(x, y)) {
      const tl = !on(x, y - 1) && !on(x - 1, y) && !on(x - 1, y - 1) ? r : 0, tr = !on(x, y - 1) && !on(x + 1, y) && !on(x + 1, y - 1) ? r : 0;
      const br = !on(x, y + 1) && !on(x + 1, y) && !on(x + 1, y + 1) ? r : 0, bl = !on(x, y + 1) && !on(x - 1, y) && !on(x - 1, y + 1) ? r : 0;
      paths.push(`M${f(X + tl)} ${f(Y)} L${f(X2 - tr)} ${f(Y)} ${tr ? `A${f(tr)} ${f(tr)} 0 0 1 ${f(X2)} ${f(Y + tr)}` : ''} L${f(X2)} ${f(Y2 - br)} ${br ? `A${f(br)} ${f(br)} 0 0 1 ${f(X2 - br)} ${f(Y2)}` : ''} L${f(X + bl)} ${f(Y2)} ${bl ? `A${f(bl)} ${f(bl)} 0 0 1 ${f(X)} ${f(Y2 - bl)}` : ''} L${f(X)} ${f(Y + tl)} ${tl ? `A${f(tl)} ${f(tl)} 0 0 1 ${f(X + tl)} ${f(Y)}` : ''} Z`);
    } else {
      if (on(x, y - 1) && on(x - 1, y)) paths.push(`M${f(X)} ${f(Y)} L${f(X + r)} ${f(Y)} A${f(r)} ${f(r)} 0 0 0 ${f(X)} ${f(Y + r)} Z`);
      if (on(x, y - 1) && on(x + 1, y)) paths.push(`M${f(X2)} ${f(Y)} L${f(X2)} ${f(Y + r)} A${f(r)} ${f(r)} 0 0 0 ${f(X2 - r)} ${f(Y)} Z`);
      if (on(x, y + 1) && on(x + 1, y)) paths.push(`M${f(X2)} ${f(Y2)} L${f(X2 - r)} ${f(Y2)} A${f(r)} ${f(r)} 0 0 0 ${f(X2)} ${f(Y2 - r)} Z`);
      if (on(x, y + 1) && on(x - 1, y)) paths.push(`M${f(X)} ${f(Y2)} L${f(X)} ${f(Y2 - r)} A${f(r)} ${f(r)} 0 0 0 ${f(X + r)} ${f(Y2)} Z`);
    }
  }
  return { H, d: paths.join(' ') };
}
/* Cobalto que se deshace en píxeles hacia abajo: la parte de abajo queda transparente, así sirve en GitHub claro y oscuro. */
function fadeOut(el, seed) {
  const w = el.offsetWidth, h = el.offsetHeight, p = pixels(w, seed), y0 = h - p.H;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><defs><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="${w}" height="${h}"><rect width="${w}" height="${h}" fill="#fff"/><g transform="translate(0 ${y0})"><path d="${p.d}" fill="#000" stroke="#000" stroke-width="1" stroke-linejoin="round"/><rect x="0" y="${p.H - 0.5}" width="${w}" height="3" fill="#000"/></g></mask></defs><rect width="${w}" height="${h}" fill="#000" mask="url(#m)"/></svg>`;
  const url = `url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}")`;
  el.style.webkitMaskImage = url; el.style.maskImage = url;
}
/* Blanco que entra en píxeles desde arriba, sobre transparente. */
function fadeIn(el, seed) {
  const w = el.offsetWidth, p = pixels(w, seed);
  el.insertAdjacentHTML('afterbegin', `<svg class="blend" style="top:0" width="${w}" height="${p.H + 1}" viewBox="0 0 ${w} ${p.H + 1}"><path d="${p.d}" fill="#fff" stroke="#fff" stroke-width=".6" stroke-linejoin="round"/><rect x="0" y="${p.H}" width="${w}" height="1.5" fill="#fff"/></svg>`);
}

const q = new URLSearchParams(location.search), V = q.get('v') || 'hero', root = document.getElementById('v');
const views = {
  hero() {

    root.innerHTML = `<div class="stage over">${eye('reposo', '#fff', 196)}<h1><span>Priv8</span><span class="soft">Sin ver tus datos.</span></h1></div>`;

  flujo() {

    root.innerHTML = `

        <div class="srow"><span class="dot a"></span>ES43 9100 0001 5740…</div>
        <div class="srow"><span class="dot a"></span>Suministros Lumen</div>
        <div class="srow"><span class="dot r"></span>PIN ● ● ● ●</div>
        <div class="srow"><span class="dot g"></span>Transferir</div>
        <div class="sbtn"><span class="pill c">Enviar</span></div>
      </div>
      <div class="node det">
        <div style="display:flex;align-items:center;gap:14px">${eye('nove', '#fff', 64)}<h3>Priv8</h3></div>
        <div class="map">
          <span class="dot g"></span><span>Transferir</span><span class="x">→</span><span class="free">Transferir</span>
          <span class="dot a"></span><span>ES43 9100…</span><span class="x">→</span><span class="tok w">‹IBAN_1-propio›</span>
          <span class="dot a"></span><span>3.412,58 €</span><span class="x">→</span><span class="tok w">‹IMPORTE_1-positivo›</span>
          <span class="dot r"></span><span>PIN</span><span class="x">→</span><span class="never">nunca sale</span>
        </div>

        <div style="display:flex;align-items:center;gap:12px">${eye('reposo', '#fff', 46)}<h3>Ejecutor</h3></div>
        <div style="display:grid;gap:10px;margin-top:20px;justify-items:start">
