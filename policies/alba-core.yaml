# ERP Alba Core (Camino 2). Selectores del DOM real de apps/erp-sim (#19).
#
# Modo estricto (#177, el de por defecto): al modelo solo llega el texto que cubre una regla.
# Los títulos, el menú y los botones tienen su regla verde; lo que no la tiene (la fecha de
# alta o la categoría de la ficha, la cabecera con el usuario) no sale.
version: 1
app: alba-core
source: web
screens:
  - id: factura.alta
    # "/" es la misma pantalla de alta (inicio del ERP).
    url_re: '/facturas/alta|^https?://[^/]+/?$'
    rules:
      - match: {sel: "#proveedor"}
        cls: ambar
        tipo: PROVEEDOR
        origen: maestro
        campo: factura.proveedor
        acepta: [maestro]
      - match: {sel: "#cif"}
        cls: ambar
        tipo: CIF
        origen: maestro
      - match: {sel: "#num-factura"}
        cls: ambar
        tipo: FACTURA
        campo: factura.numero
        acepta: [correo, maestro]
      - match: {sel: "#importe"}
        cls: ambar
        tipo: IMPORTE
        rasgo_signo: true
        campo: factura.importe
        acepta: [correo, maestro]
      - match: {sel: "#pago-iban"}
        cls: ambar
        tipo: IBAN
        origen: maestro
        campo: pago.iban
        acepta: [maestro]
      - match: {sel: "#pedido"}
        cls: ambar
        tipo: FACTURA
        origen: maestro
      - match: {sel: "#importe-pedido"}
        cls: ambar
        tipo: IMPORTE
        origen: maestro
        rasgo_signo: true
      - match: {sel: "#registrar"}
        cls: verde
        critica: firmar
        resumen: ["#num-factura", "#importe", "#pago-iban"]
      - {match: {sel_re: '^#(ver-proveedor|aviso|alta-titulo|menu-alta|menu-facturas|menu-proveedores)$'}, cls: verde}
  - id: proveedor.ficha
    url_re: /proveedores/\d+
    rules:
      - match: {sel: "#nombre"}
        cls: ambar
        tipo: PROVEEDOR
        origen: maestro
      - match: {sel: "#iban"}
        cls: ambar
        tipo: IBAN
        origen: maestro
        campo: proveedor.iban
        acepta: [maestro]
      - match: {sel: "#cif-prov"}
        cls: ambar
        tipo: CIF
        origen: maestro
      - match: {sel: "#telefono"}
        cls: ambar
        tipo: TEL
        origen: maestro
      - match: {sel: "#email"}
        cls: ambar
        tipo: EMAIL
        origen: maestro
      - match: {sel: "#guardar"}
        cls: verde
        critica: firmar
      - {match: {sel_re: '^#(volver|ficha-titulo|menu-alta|menu-facturas|menu-proveedores)$'}, cls: verde}
  - id: login
    url_re: /login
    detector: false
    rules:
      - match: {sel: "#usuario"}
        cls: rojo
      - match: {sel: "#clave"}
        cls: rojo
      - {match: {sel_re: '^#(login-titulo|login-error|entrar)$'}, cls: verde}
  - id: facturas.lista
    url_re: /facturas/?$
    rules:
      # Cada fila es una factura con número, proveedor, pedido e importe: entera ámbar.
      - match: {sel_re: '^#factura-\d+$'}
        cls: ambar
        tipo: FACTURA
        origen: maestro
      - {match: {sel_re: '^#(facturas-titulo|menu-alta|menu-facturas|menu-proveedores)$'}, cls: verde}
  - id: proveedores.lista
    url_re: /proveedores/?$
    rules:
      - match: {sel_re: '^#prov-\d+$'}
        cls: ambar
        tipo: PROVEEDOR
        origen: maestro
      - {match: {sel_re: '^#(proveedores-titulo|menu-alta|menu-facturas|menu-proveedores)$'}, cls: verde}
