# Bandeja de correo simulada (Camino 2). Todo lo que se lee aquí viene de un correo.
#
# Modo estricto (#177, el de por defecto): al modelo solo llega el texto que cubre una regla.
# Las reglas verdes de títulos, botones y del cuerpo del correo son las que la tarea necesita
# leer; el resto de la página (etiquetas, carpetas, avatares) no sale.
version: 1
app: inbox
source: web
screens:
  - id: bandeja
    # "/" también pinta la bandeja de entrada.
    url_re: '/bandeja/?$|^https?://[^/]+/?$'
    origen: correo
    rules:
      - match: {sel: ".remitente"}
        cls: ambar
        tipo: EMAIL
        origen: correo
      # Asunto de cada fila: el número de factura o pedido se tokeniza y el resto queda verde.
      - match: {sel: ".asunto"}
        cls: ambar
        tipo: FACTURA
        origen: correo
        extract: '\b([A-Z]{1,3}-\d{4}-\d{3,6})\b'
      - {match: {sel_re: '^#(abrir-\d+|nav-bandeja|nav-enviados|aviso|bandeja-titulo)$'}, cls: verde}
  - id: correo.lectura
    url_re: /correo/
    origen: correo
    rules:
      - match: {sel: "#de"}
        cls: ambar
        tipo: EMAIL
        origen: correo
      - match: {sel: "#asunto"}
        cls: ambar
        tipo: FACTURA
        origen: correo
        extract: "^Factura (.+)$"
      - match: {sel: "#adjunto"}
        cls: verde
      # Campos que se leen del PDF adjunto en local (#20). Todo es de origen correo.
      - {match: {sel: "#pdf-proveedor"}, cls: ambar, tipo: PROVEEDOR, origen: correo}
      - {match: {sel: "#pdf-cif"}, cls: ambar, tipo: CIF, origen: correo}
      - {match: {sel: "#pdf-numero"}, cls: ambar, tipo: FACTURA, origen: correo}
      - {match: {sel: "#pdf-importe"}, cls: ambar, tipo: IMPORTE, origen: correo, rasgo_signo: true}
      - {match: {sel: "#responder"}, cls: verde}
      # Cuerpo del correo: texto libre de un tercero que 8 tiene que leer (la factura, el cambio
      # de cuenta). Es el único texto libre que sale en modo estricto, porque esta regla lo dice:
      # el detector tokeniza IBAN, teléfonos, correos, importes y nombres con origen correo.
      - {match: {sel: "#cuerpo"}, cls: verde}
      - {match: {sel_re: '^#(nav-bandeja|nav-enviados)$'}, cls: verde}
      # Texto suelto de la página (#154): el nombre del remitente, tapado como en la bandeja.
      - {match: {sel: ".nombre"}, cls: ambar, tipo: PROVEEDOR, origen: correo}
  - id: correo.respuesta
    url_re: /responder/
    origen: correo
    rules:
      - match: {sel: "#para"}
        cls: ambar
        tipo: EMAIL
        origen: correo
        campo: correo.para
        acepta: [correo, maestro]
      - match: {sel: "#asunto-resp"}
        cls: ambar
        tipo: FACTURA
        origen: correo
        extract: '\b([A-Z]{1,3}-\d{4}-\d{3,6})\b'
      - match: {sel: "#enviar"}
        cls: verde
        critica: enviar
        resumen: ["#para"]
      # Lo que escribe 8 (con tokens) y la interfaz del formulario.
      - {match: {sel_re: '^#(texto|respuesta-titulo|descartar|nav-bandeja|nav-enviados)$'}, cls: verde}
      - {match: {sel: ".nombre"}, cls: ambar, tipo: PROVEEDOR, origen: correo}
