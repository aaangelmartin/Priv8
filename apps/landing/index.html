<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Priv8</title>
    <meta name="description" content="Priv8 deja que un agente de IA use pantallas sin ver los datos. Para empresas, bancos y para tu móvil." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" />
    <script>
      /* La bienvenida empieza antes de pintar: fondo cobalto y 8 en el centro. Sin ella si se pide menos movimiento. */
      try {
        var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        document.documentElement.classList.add('js');
        if (location.hash !== '#transiciones') {
          /* la bienvenida sale siempre al cargar: arriba del todo y sin el ancla de la última sección visitada */
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
          if (location.hash) history.replaceState(null, '', location.pathname + location.search);
          window.scrollTo(0, 0);
          if (!still) document.documentElement.classList.add('intro');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
