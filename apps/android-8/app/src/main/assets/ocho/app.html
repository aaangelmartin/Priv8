<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>8</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Pantalla provisional: solo el 8 sobre cobalto. Las pantallas de la app
     (conversación, confirmación, «mira a otro lado», «no puedo») llegan con
     el diseño de la issue #36 (Camino 3). */
  html, body { margin: 0; height: 100%; background: #2D45D6; overflow: hidden; }
  #ojos { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #2D45D6; }
  #estado {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #FFFFFF; opacity: .8; text-align: center;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <iframe id="ojos" src="ojos.html" title="8"></iframe>
  <div id="estado" hidden></div>
  <script src="estados.js"></script>
  <script src="app.js"></script>
</body>
</html>
